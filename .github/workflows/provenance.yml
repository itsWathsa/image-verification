name: Native C2PA verification

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - .github/workflows/provenance.yml
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install full app dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression checks
        run: python -m unittest -v
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the native provenance dependencies
        run: python -m pip install c2pa-python==0.39.0 'Pillow>=11,<13'
      - name: Verify signed, tampered, and unsigned fixtures
        run: python scripts/check_native_provenance.py --output native-provenance-results.json
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-provenance-report
          path: native-provenance-results.json
          if-no-files-found: warn
